name: Release

# Pushing a tag v<version> publishes that version: NSIS and MSI installers, their updater signatures
# (.sig) and the updater manifest (latest.json) the app reads. A version with a suffix
# (v0.2.0-beta.1) is a pre-release, built as NSIS only: WiX rejects non-numeric pre-release versions.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # The release body is also `notes` in latest.json: the update dialog shows it.
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node --experimental-strip-types scripts/release-notes.ts "${GITHUB_REF_NAME#v}"
            echo NOTES_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Keygloss ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Installed copies update through the NSIS installer, not the MSI.
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json${{ contains(github.ref_name, '-') && ' --bundles nsis' || '' }}
