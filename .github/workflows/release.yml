name: Release

# Pushing a tag v<version> publishes that version: NSIS and MSI installers, a universal macOS .dmg,
# their updater artifacts and signatures (.sig) and the updater manifest (latest.json) the app reads,
# and Linux .deb and .rpm packages. A version with a suffix (v0.2.0-beta.1) is a pre-release, built
# as NSIS only on Windows (WiX rejects non-numeric pre-release versions) and .deb only on Linux.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # The release body is also `notes` in latest.json: the update dialog shows it.
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node --experimental-strip-types scripts/release-notes.ts "${GITHUB_REF_NAME#v}"
            echo NOTES_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Keygloss ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Installed copies update through the NSIS installer, not the MSI.
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json${{ contains(github.ref_name, '-') && ' --bundles nsis' || '' }}

  # A universal (Apple Silicon + Intel) .app and .dmg, plus the updater's .app.tar.gz, added to the
  # same release and manifest. After the Windows job: both jobs edit latest.json.
  # Signed with a Developer ID and notarized when the APPLE_* secrets exist; otherwise signed with a
  # self-signed certificate (MACOS_CERTIFICATE), or ad-hoc without one. Gatekeeper then blocks the
  # first launch of a download; ad-hoc signed, macOS also asks for the Accessibility permission
  # again after every update.
  release-macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node --experimental-strip-types scripts/release-notes.ts "${GITHUB_REF_NAME#v}"
            echo NOTES_EOF
          } >> "$GITHUB_OUTPUT"
      # Exported only when set: the bundler treats an empty APPLE_CERTIFICATE as a certificate.
      - name: Apple signing and notarization (when configured)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<APPLE_EOF"; echo "${!v}"; echo APPLE_EOF; } >> "$GITHUB_ENV"
            fi
          done
      # Without a Developer ID: sign with the same self-signed certificate every release (MACOS_CERTIFICATE,
      # a base64 .p12 whose common name is "Keygloss Self-Signed", and MACOS_CERTIFICATE_PASSWORD).
      # macOS ties the Accessibility grant to the certificate, so it survives updates. The bundler
      # only imports Developer ID certificates, so this one goes into a keychain here.
      - name: Self-signed signing (without a Developer ID)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE" ]; then exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -f pkcs12 -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=Keygloss Self-Signed" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Keygloss ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target universal-apple-darwin --config src-tauri/tauri.release.macos.conf.json
      # Stable releases publish packaging/homebrew/keygloss.rb, with this version and the .dmg's
      # sha256, to the tap (xArchange1/homebrew-tap). HOMEBREW_TAP_DEPLOY_KEY is the private half of
      # a write deploy key on that repository.
      - if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/checkout@v7
        with:
          repository: xArchange1/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap
      - name: Update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          sha=$(shasum -a 256 target/universal-apple-darwin/release/bundle/dmg/*.dmg | cut -d' ' -f1)
          sed -e "s/^  version \".*\"/  version \"$version\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" \
            packaging/homebrew/keygloss.rb > homebrew-tap/Casks/keygloss.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/keygloss.rb
          git diff --cached --quiet || { git commit -m "keygloss $version" && git push; }

  # x86_64 .deb and .rpm packages (packaging/linux/install.sh installs them). They are not
  # self-updating: the app only reports a new release, so they stay out of latest.json. After the
  # Windows job, which creates the release. Ubuntu 22.04: the oldest glibc the packages then need.
  release-linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Tauri (WebKitGTK, tray), xkbcommon, udev and ALSA headers the Linux build needs.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libxkbcommon-dev libudev-dev libasound2-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node --experimental-strip-types scripts/release-notes.ts "${GITHUB_REF_NAME#v}"
            echo NOTES_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Keygloss ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: false
          args: --config src-tauri/tauri.release.linux.conf.json${{ contains(github.ref_name, '-') && ' --bundles deb' || '' }}
