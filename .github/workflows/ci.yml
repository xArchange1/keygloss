name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Pull requests that only touch Markdown, docs/ or the site skip the build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ] ||
             gh pr diff ${{ github.event.number }} -R ${{ github.repository }} --name-only | grep -qvE '\.md$|^docs/|^site/'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Tauri (WebKitGTK, tray), xkbcommon, udev and ALSA headers the Linux build needs.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libxkbcommon-dev libudev-dev libasound2-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      # Before cargo: the Tauri build embeds the built frontend (dist).
      - run: pnpm build
      - run: cargo clippy --workspace
      - run: cargo test --workspace

  # The required check: one stable name for the whole OS matrix.
  ci:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.changes.result }}" = success && [[ "${{ needs.build.result }}" =~ ^(success|skipped)$ ]]
